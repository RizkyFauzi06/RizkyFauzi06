<svg width="600" height="120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .rain { fill: #24292f; font-family: monospace; font-size: 14px; animation: fall linear infinite; font-weight: bold; }
    @keyframes fall {
      0% { transform: translateY(-20px) translateX(10px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(120px) translateX(-10px); opacity: 0; }
    }
    .d1 { animation-duration: 1s; animation-delay: 0s; }
    .d2 { animation-duration: 1.2s; animation-delay: 0.3s; }
    .d3 { animation-duration: 0.9s; animation-delay: 0.6s; }
    .d4 { animation-duration: 1.1s; animation-delay: 0.2s; }
    .d5 { animation-duration: 1.3s; animation-delay: 0.5s; }
  </style>
  <!-- ASCII Raindrops -->
  <text x="40" y="0" class="rain d1">|</text>
  <text x="130" y="0" class="rain d2">/</text>
  <text x="210" y="0" class="rain d3">|</text>
  <text x="290" y="0" class="rain d4">|</text>
  <text x="370" y="0" class="rain d1">/</text>
  <text x="450" y="0" class="rain d5">|</text>
  <text x="530" y="0" class="rain d2">|</text>
  <text x="590" y="0" class="rain d3">/</text>
</svg>
